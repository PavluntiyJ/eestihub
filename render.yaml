services:
  - type: web
    name: eestihub-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python -m scripts.import_gtfs
    startCommand: python -m scripts.seed_housing && python -m scripts.ingest_rents && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
